<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCare - Student Complaint Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for reactive state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white" 
      x-data="complaintApp()">

    <!-- HEADER NAVBAR -->
    <header class="bg-indigo-600 shadow-md text-white sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-xl border border-white/20">
                    <i class="fa-solid fa-graduation-cap text-2xl text-indigo-100"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">CampusCare</h1>
                    <p class="text-xs text-indigo-200">Student Grievance & Resolution Portal</p>
                </div>
            </div>

            <!-- User Session Bar -->
            <template x-if="currentUser">
                <div class="flex items-center space-x-4">
                    <div class="hidden sm:flex flex-col text-right">
                        <span class="text-sm font-semibold" x-text="currentUser.name"></span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-700/60 uppercase tracking-wider text-indigo-200 font-medium inline-block w-max ml-auto" x-text="currentUser.role"></span>
                    </div>
                    <button @click="logout()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-4 py-2 rounded-lg font-medium transition shadow-sm flex items-center space-x-2">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </template>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- LOGIN SCREEN -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto mt-12 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
                <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 p-6 text-white text-center">
                    <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-3 border border-white/20 shadow-inner">
                        <i class="fa-solid fa-shield-halved text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold">Portal Access</h2>
                    <p class="text-indigo-200 text-sm mt-1">Select your role or sign in instantly</p>
                </div>

                <div class="p-6 sm:p-8 space-y-6">
                    <!-- Quick Demo Role Switcher -->
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="quickLogin('student')" class="p-3 text-center border-2 border-indigo-100 hover:border-indigo-600 rounded-xl bg-slate-50 hover:bg-indigo-50/50 transition group">
                            <i class="fa-solid fa-user-graduate text-indigo-600 text-lg mb-1 block group-hover:scale-110 transition-transform"></i>
                            <span class="text-xs font-bold uppercase text-slate-700 block">Demo Student</span>
                            <span class="text-[10px] text-slate-400">Alex Student</span>
                        </button>
                        <button @click="quickLogin('admin')" class="p-3 text-center border-2 border-indigo-100 hover:border-indigo-600 rounded-xl bg-slate-50 hover:bg-indigo-50/50 transition group">
                            <i class="fa-solid fa-user-shield text-indigo-600 text-lg mb-1 block group-hover:scale-110 transition-transform"></i>
                            <span class="text-xs font-bold uppercase text-slate-700 block">Demo Admin</span>
                            <span class="text-[10px] text-slate-400">Dr. Administrator</span>
                        </button>
                    </div>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase tracking-wider font-semibold">Or custom login</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>

                    <form @submit.prevent="handleLogin" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Username or Email</label>
                            <input type="text" x-model="loginForm.username" required placeholder="e.g. student1 or admin1"
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Role Type</label>
                            <select x-model="loginForm.role" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50/50">
                                <option value="student">Student</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition duration-200 flex items-center justify-center space-x-2">
                            <span>Sign In to Dashboard</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- STUDENT DASHBOARD -->
        <template x-if="currentUser && currentUser.role === 'student'">
            <div class="space-y-8">
                <!-- Welcome Banner & Quick stats -->
                <div class="bg-gradient-to-r from-indigo-900 to-slate-900 rounded-3xl p-6 sm:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div>
                        <span class="text-indigo-400 font-semibold text-xs uppercase tracking-wider">Student Portal</span>
                        <h2 class="text-2xl sm:text-3xl font-bold mt-1">Welcome back, <span x-text="currentUser.name"></span>!</h2>
                        <p class="text-slate-300 text-sm mt-1">Submit your grievances regarding hostel, academics, IT infrastructure, or facilities and track status live.</p>
                    </div>
                    <button @click="openNewComplaintModal = true" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-2xl font-semibold shadow-md transition flex items-center space-x-2 text-sm flex-shrink-0">
                        <i class="fa-solid fa-plus-circle text-lg"></i>
                        <span>File New Complaint</span>
                    </button>
                </div>

                <!-- Complaints Section -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">My Submitted Complaints</h3>
                            <p class="text-xs text-slate-500">Track resolution progress and administrator notes.</p>
                        </div>
                        <div class="flex items-center space-x-3 w-full sm:w-auto">
                            <select x-model="studentFilterStatus" class="px-3 py-2 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto">
                                <option value="All">All Statuses</option>
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Resolved">Resolved</option>
                            </select>
                        </div>
                    </div>

                    <!-- Complaints Grid / Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100 text-slate-400 text-xs uppercase tracking-wider font-bold">
                                    <th class="py-3 px-4">Ticket ID</th>
                                    <th class="py-3 px-4">Department</th>
                                    <th class="py-3 px-4">Category</th>
                                    <th class="py-3 px-4">Priority</th>
                                    <th class="py-3 px-4">Description</th>
                                    <th class="py-3 px-4">Status</th>
                                    <th class="py-3 px-4 text-right">Date</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                <template x-for="c in filteredStudentComplaints" :key="c.id">
                                    <tr class="hover:bg-slate-50/80 transition">
                                        <td class="py-4 px-4 font-mono font-semibold text-indigo-600" x-text="'#' + c.id"></td>
                                        <td class="py-4 px-4 font-medium text-slate-700" x-text="c.department"></td>
                                        <td class="py-4 px-4 text-slate-600" x-text="c.category"></td>
                                        <td class="py-4 px-4">
                                            <span class="px-2.5 py-1 rounded-full text-xs font-bold"
                                                  :class="{
                                                      'bg-red-50 text-red-600 border border-red-200': c.priority === 'High',
                                                      'bg-amber-50 text-amber-600 border border-amber-200': c.priority === 'Medium',
                                                      'bg-emerald-50 text-emerald-600 border border-emerald-200': c.priority === 'Low'
                                                  }" x-text="c.priority"></span>
                                        </td>
                                        <td class="py-4 px-4 text-slate-600 max-w-xs truncate" x-text="c.description" :title="c.description"></td>
                                        <td class="py-4 px-4">
                                            <span class="px-3 py-1 rounded-full text-xs font-bold inline-flex items-center space-x-1.5 shadow-xs"
                                                  :class="{
                                                      'bg-amber-100 text-amber-800': c.status === 'Pending',
                                                      'bg-blue-100 text-blue-800': c.status === 'In Progress',
                                                      'bg-emerald-100 text-emerald-800': c.status === 'Resolved'
                                                  }">
                                                <span class="w-1.5 h-1.5 rounded-full"
                                                      :class="{
                                                          'bg-amber-500': c.status === 'Pending',
                                                          'bg-blue-500': c.status === 'In Progress',
                                                          'bg-emerald-500': c.status === 'Resolved'
                                                      }"></span>
                                                <span x-text="c.status"></span>
                                            </span>
                                        </td>
                                        <td class="py-4 px-4 text-right text-xs text-slate-400 font-mono" x-text="c.date"></td>
                                    </tr>
                                </template>
                                <template x-if="filteredStudentComplaints.length === 0">
                                    <tr>
                                        <td colspan="7" class="py-12 text-center text-slate-400">
                                            <div class="flex flex-col items-center justify-center space-y-2">
                                                <i class="fa-regular fa-folder-open text-3xl"></i>
                                                <p>No complaints found matching your filter criteria.</p>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>

        <!-- ADMIN DASHBOARD -->
        <template x-if="currentUser && currentUser.role === 'admin'">
            <div class="space-y-8">
                <!-- Metrics Overview Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Complaints</p>
                            <h3 class="text-3xl font-extrabold text-slate-800 mt-1" x-text="stats.total"></h3>
                        </div>
                        <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 text-xl">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-amber-500">Pending Review</p>
                            <h3 class="text-3xl font-extrabold text-slate-800 mt-1" x-text="stats.pending"></h3>
                        </div>
                        <div class="w-14 h-14 bg-amber-50 rounded-2xl flex items-center justify-center text-amber-600 text-xl">
                            <i class="fa-solid fa-clock"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-blue-500">In Progress</p>
                            <h3 class="text-3xl font-extrabold text-slate-800 mt-1" x-text="stats.inProgress"></h3>
                        </div>
                        <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 text-xl">
                            <i class="fa-solid fa-spinner"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-emerald-500">Resolved</p>
                            <h3 class="text-3xl font-extrabold text-slate-800 mt-1" x-text="stats.resolved"></h3>
                        </div>
                        <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 text-xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                    </div>
                </div>

                <!-- Admin Main Control Table Section -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">Campus-Wide Grievance Management</h3>
                            <p class="text-xs text-slate-500">Review student complaints, filter by department or status, and update progress.</p>
                        </div>
                        <!-- Filters -->
                        <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                            <div class="relative flex-grow sm:flex-grow-0">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-search text-xs"></i>
                                </span>
                                <input type="text" x-model="adminSearch" placeholder="Search student or description..." 
                                       class="pl-9 pr-4 py-2 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-64">
                            </div>
                            <select x-model="adminFilterStatus" class="px-3 py-2 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="All">Status: All</option>
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Resolved">Resolved</option>
                            </select>
                            <select x-model="adminFilterDept" class="px-3 py-2 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="All">Dept: All</option>
                                <template x-for="dept in departments" :key="dept">
                                    <option :value="dept" x-text="dept"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <!-- Admin Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100 text-slate-400 text-xs uppercase tracking-wider font-bold">
                                    <th class="py-3 px-4">ID / Student</th>
                                    <th class="py-3 px-4">Department</th>
                                    <th class="py-3 px-4">Category</th>
                                    <th class="py-3 px-4">Priority</th>
                                    <th class="py-3 px-4">Description</th>
                                    <th class="py-3 px-4">Status Update</th>
                                    <th class="py-3 px-4 text-right">Date</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                <template x-for="c in filteredAdminComplaints" :key="c.id">
                                    <tr class="hover:bg-slate-50/80 transition">
                                        <td class="py-4 px-4">
                                            <span class="font-mono font-semibold text-indigo-600 block" x-text="'#' + c.id"></span>
                                            <span class="text-xs text-slate-500 font-medium" x-text="c.studentName"></span>
                                        </td>
                                        <td class="py-4 px-4 font-medium text-slate-700" x-text="c.department"></td>
                                        <td class="py-4 px-4 text-slate-600" x-text="c.category"></td>
                                        <td class="py-4 px-4">
                                            <span class="px-2.5 py-1 rounded-full text-xs font-bold"
                                                  :class="{
                                                      'bg-red-50 text-red-600 border border-red-200': c.priority === 'High',
                                                      'bg-amber-50 text-amber-600 border border-amber-200': c.priority === 'Medium',
                                                      'bg-emerald-50 text-emerald-600 border border-emerald-200': c.priority === 'Low'
                                                  }" x-text="c.priority"></span>
                                        </td>
                                        <td class="py-4 px-4 text-slate-600 max-w-xs truncate" x-text="c.description" :title="c.description"></td>
                                        <td class="py-4 px-4">
                                            <select @change="updateStatus(c.id, $event.target.value)"
                                                    class="px-3 py-1.5 rounded-xl border text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs"
                                                    :class="{
                                                        'bg-amber-50 text-amber-800 border-amber-200': c.status === 'Pending',
                                                        'bg-blue-50 text-blue-800 border-blue-200': c.status === 'In Progress',
                                                        'bg-emerald-50 text-emerald-800 border-emerald-200': c.status === 'Resolved'
                                                    }">
                                                <option value="Pending" :selected="c.status === 'Pending'">Pending</option>
                                                <option value="In Progress" :selected="c.status === 'In Progress'">In Progress</option>
                                                <option value="Resolved" :selected="c.status === 'Resolved'">Resolved</option>
                                            </select>
                                        </td>
                                        <td class="py-4 px-4 text-right text-xs text-slate-400 font-mono" x-text="c.date"></td>
                                    </tr>
                                </template>
                                <template x-if="filteredAdminComplaints.length === 0">
                                    <tr>
                                        <td colspan="7" class="py-12 text-center text-slate-400">
                                            <div class="flex flex-col items-center justify-center space-y-2">
                                                <i class="fa-regular fa-folder-open text-3xl"></i>
                                                <p>No complaints found matching filter filters.</p>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <!-- NEW COMPLAINT MODAL (Student) -->
    <div x-show="openNewComplaintModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4" style="display: none;">
        <div @click.away="openNewComplaintModal = false" class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 transform transition-all">
            <div class="bg-indigo-600 px-6 py-4 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center space-x-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Submit New Grievance</span>
                </h3>
                <button @click="openNewComplaintModal = false" class="text-indigo-200 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form @submit.prevent="submitComplaint" class="p-6 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Department</label>
                        <select x-model="newComplaint.department" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                            <option value="">Select Dept...</option>
                            <template x-for="dept in departments" :key="dept">
                                <option :value="dept" x-text="dept"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Priority Level</label>
                        <select x-model="newComplaint.priority" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Complaint Category / Issue</label>
                    <input type="text" x-model="newComplaint.category" required placeholder="e.g. Wi-Fi Router Malfunction, Mess Food Quality"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Detailed Description</label>
                    <textarea x-model="newComplaint.description" rows="4" required placeholder="Provide clear details including room number, timing, or specific issue..."
                              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="pt-3 flex space-x-3">
                    <button type="button" @click="openNewComplaintModal = false" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">
                        Cancel
                    </button>
                    <button type="submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition">
                        Submit Ticket
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div x-show="toast.show" x-transition class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-800" style="display: none;">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span class="text-sm font-medium" x-text="toast.message"></span>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-100 py-6 mt-12 text-center text-xs text-slate-400">
        <p>&copy; 2026 CampusCare Student Complaint Management System. All rights reserved.</p>
    </footer>

    <script>
        function complaintApp() {
            return {
                currentUser: null,
                openNewComplaintModal: false,
                studentFilterStatus: 'All',
                adminFilterStatus: 'All',
                adminFilterDept: 'All',
                adminSearch: '',
                
                toast: {
                    show: false,
                    message: ''
                },

                departments: [
                    'Hostel & Accommodation',
                    'Academics & Examination',
                    'IT & Campus Wi-Fi',
                    'Mess & Canteen',
                    'Library & Labs',
                    'Sports & Recreation'
                ],

                loginForm: {
                    username: '',
                    role: 'student'
                },

                newComplaint: {
                    department: '',
                    priority: 'Medium',
                    category: '',
                    description: ''
                },

                complaints: [],

                init() {
                    // Load data from localStorage or seed initial sample data
                    const saved = localStorage.getItem('campuscare_complaints');
                    if (saved) {
                        try {
                            this.complaints = JSON.parse(saved);
                        } catch(e) {
                            this.loadDefaultData();
                        }
                    } else {
                        this.loadDefaultData();
                    }

                    // Check active user session
                    const sessionUser = localStorage.getItem('campuscare_user');
                    if (sessionUser) {
                        try {
                            this.currentUser = JSON.parse(sessionUser);
                        } catch(e) {}
                    }
                },

                loadDefaultData() {
                    this.complaints = [
                        {
                            id: 101,
                            studentId: 'student1',
                            studentName: 'Alex Student',
                            department: 'IT & Campus Wi-Fi',
                            category: 'Hostel Block B Router Down',
                            priority: 'High',
                            description: 'Wi-Fi disconnects repeatedly every 5 minutes in room 304.',
                            status: 'Pending',
                            date: '2026-06-10'
                        },
                        {
                            id: 102,
                            studentId: 'student1',
                            studentName: 'Alex Student',
                            department: 'Hostel & Accommodation',
                            category: 'Geyser Repair Request',
                            priority: 'Medium',
                            description: 'Hot water geyser in common bathroom third floor is not heating.',
                            status: 'In Progress',
                            date: '2026-06-08'
                        },
                        {
                            id: 103,
                            studentId: 'student2',
                            studentName: 'Sarah Jenkins',
                            department: 'Mess & Canteen',
                            category: 'Vegetarian Meal Options',
                            priority: 'Low',
                            description: 'Requesting additional gluten-free options in evening dinner menu.',
                            status: 'Resolved',
                            date: '2026-06-05'
                        }
                    ];
                    this.saveData();
                },

                saveData() {
                    localStorage.setItem('campuscare_complaints', JSON.stringify(this.complaints));
                },

                quickLogin(role) {
                    if (role === 'student') {
                        this.currentUser = { id: 'student1', name: 'Alex Student', role: 'student' };
                    } else {
                        this.currentUser = { id: 'admin1', name: 'Dr. Administrator', role: 'admin' };
                    }
                    localStorage.setItem('campuscare_user', JSON.stringify(this.currentUser));
                    this.showToast('Successfully signed in as ' + this.currentUser.name);
                },

                handleLogin() {
                    if (!this.loginForm.username) return;
                    const name = this.loginForm.username.charAt(0).toUpperCase() + this.loginForm.username.slice(1);
                    this.currentUser = {
                        id: this.loginForm.username.toLowerCase(),
                        name: name,
                        role: this.loginForm.role
                    };
                    localStorage.setItem('campuscare_user', JSON.stringify(this.currentUser));
                    this.showToast('Welcome back, ' + name);
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('campuscare_user');
                    this.showToast('Logged out successfully');
                },

                submitComplaint() {
                    if (!this.newComplaint.department || !this.newComplaint.category || !this.newComplaint.description) return;
                    
                    const newId = Math.floor(100 + Math.random() * 900);
                    const ticket = {
                        id: newId,
                        studentId: this.currentUser.id,
                        studentName: this.currentUser.name,
                        department: this.newComplaint.department,
                        category: this.newComplaint.category,
                        priority: this.newComplaint.priority,
                        description: this.newComplaint.description,
                        status: 'Pending',
                        date: new Date().toISOString().split('T')[0]
                    };

                    this.complaints.unshift(ticket);
                    this.saveData();

                    // Reset form
                    this.newComplaint = { department: '', priority: 'Medium', category: '', description: '' };
                    this.openNewComplaintModal = false;
                    this.showToast('Complaint #' + newId + ' submitted successfully!');
                },

                updateStatus(id, newStatus) {
                    const comp = this.complaints.find(c => c.id === id);
                    if (comp) {
                        comp.status = newStatus;
                        this.saveData();
                        this.showToast('Complaint #' + id + ' status updated to ' + newStatus);
                    }
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.show = true;
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 3500);
                },

                get filteredStudentComplaints() {
                    if (!this.currentUser) return [];
                    let list = this.complaints.filter(c => c.studentId === this.currentUser.id);
                    if (this.studentFilterStatus !== 'All') {
                        list = list.filter(c => c.status === this.studentFilterStatus);
                    }
                    return list;
                },

                get filteredAdminComplaints() {
                    let list = this.complaints;
                    if (this.adminFilterStatus !== 'All') {
                        list = list.filter(c => c.status === this.adminFilterStatus);
                    }
                    if (this.adminFilterDept !== 'All') {
                        list = list.filter(c => c.department === this.adminFilterDept);
                    }
                    if (this.adminSearch.trim() !== '') {
                        const q = this.adminSearch.toLowerCase();
                        list = list.filter(c => c.studentName.toLowerCase().includes(q) || c.description.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
                    }
                    return list;
                },

                get stats() {
                    return {
                        total: this.complaints.length,
                        pending: this.complaints.filter(c => c.status === 'Pending').length,
                        inProgress: this.complaints.filter(c => c.status === 'In Progress').length,
                        resolved: this.complaints.filter(c => c.status === 'Resolved').length
                    };
                }
            }
        }
    </script>
</body>
</html>
